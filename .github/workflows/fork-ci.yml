name: Fork CI
# Fork-only: runs upstream's CI (ci.yml) for the fork's integration branch `develop`.
# ci.yml itself only triggers on `main`; see FORK.md.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
