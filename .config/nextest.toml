# `cargo nextest run --profile ubuntu-remote` skips the tests that fail on the
# ubuntu build host for environment reasons, not code: three ide-sdk tests need Go
# and a JDK on PATH; maven_runner_jre_overrides_the_project_jdk fails there on
# upstream's v0.1.39 tag as well, and
# tool_installs_resolve_project_relative_sdks_and_leave_path_fallback_unconfigured
# finds the host's Go on PATH (fails on upstream's v0.1.40 tag there too).
# CI uses the default profile and runs everything.
[profile.ubuntu-remote]
default-filter = """
not (
  (package(ide-sdk) & test(=tests::go_modules_configure_gopls_in_place_and_commands_with_explicit_run_overrides))
  | (package(ide-sdk) & test(=tests::go_constraints_change_only_protocol_settings))
  | (package(ide-sdk) & test(=tests::project_jdk_and_maven_settings))
  | (package(ide-sdk) & test(=tests::maven_runner_jre_overrides_the_project_jdk))
  | (package(ide-sdk) & test(=tests::tool_installs_resolve_project_relative_sdks_and_leave_path_fallback_unconfigured))
)
"""
