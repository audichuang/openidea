[package]
name = "ide-http"
description = "HTTP Client: .http request files, environments, execution and response history"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ide-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFError", "CFNumber", "CFString", "CFURL"] }
objc2-cf-network = { version = "0.3", default-features = false, features = ["std", "CFProxySupport"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
tempfile.workspace = true
