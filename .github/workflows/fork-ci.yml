name: Fork CI
# Fork-only merge gate for `develop` (see FORK.md "Merge gate"). It runs the same checks as
# upstream's ci.yml, split for speed: clippy and tests in parallel jobs, a develop cache PRs
# restore, no debug info, and jobs skipped when a PR touches none of their paths. Upstream's
# ci.yml stays unedited; the `upstream-ci` job fails when it changes, so its edits get ported.
on:
  push:
    branches: [develop, "rebase/**"]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # Why: the target cache key rolls over each ISO week; this builds the new week's caches on develop
  # before the first PR of the week would have to build cold.
  schedule:
    - cron: "5 0 * * 1"

concurrency:
  group: fork-ci-${{ github.ref }}
  # Why not develop: a develop run saves the caches every PR restores; cancelling it wastes them.
  # PRs and rebase/** heads cancel their superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Why: debug info is most of the link time of ~100 test binaries, and CI reads no debugger.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Why: Windows' default link.exe is the slowest step there; rust-lld links the same objects.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  scope:
    name: Scope
    # Why: the auto-rebase's lock commit only carries the old develop's tree.
    if: ${{ !startsWith(github.event.head_commit.message, 'auto-rebase lock') }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: scope
        env:
          # A PR compares with its base; a develop push with the commit it moved develop from.
          BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/develop' && github.event.before) || '' }}
        run: |
          # rebase/** pushes, manual runs and a develop push without a usable parent check everything.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rust=false web=false
          while IFS= read -r f; do
            case "$f" in
              # Never reaches the app or a test: agent docs, fork rules, the auto-rebase skill.
              # The release workflow only runs on a fork tag; CI cannot exercise it.
              *.md|docs/*|LICENSE|NOTICE|.claude/*|scripts/fork/*|.github/workflows/fork-release.yml|.github/actions/fork-release-setup/*) ;;
              crates/*|src-tauri/*|Cargo.toml|Cargo.lock|deny.toml|rustfmt.toml|wit/*) rust=true ;;
              # src/bindings.ts is generated from Rust: a change there needs the bindings check too.
              src/bindings.ts) rust=true; web=true ;;
              src/*|e2e/*|public/*|perf/*|index.html|vite.config.ts|playwright.config.ts|knip.ts|tsconfig*.json) web=true ;;
              *) rust=true; web=true ;;
            esac
          done < <(git diff --name-only "$BASE...$GITHUB_SHA")
          echo "rust=$rust web=$web"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"; echo "web=$web" >> "$GITHUB_OUTPUT"

  upstream-ci:
    name: Upstream ci.yml unchanged
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          # Port upstream's ci.yml edits into this file, then update the pin.
          pin=094f0ab1f3516ab6ac5fb4135597cefbddaf1f1cab7d5c44ae98bdbec1b72e0f
          sha=$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)
          [ "$sha" = "$pin" ] || { echo "::error::upstream ci.yml changed ($sha); port it into fork-ci.yml and update the pin"; exit 1; }

  precheck:
    name: Auto-rebase precheck scenarios
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash .claude/skills/openidea-fork-auto-rebase/scripts/precheck.test.sh
        if: hashFiles('.claude/skills/openidea-fork-auto-rebase/scripts/precheck.test.sh') != ''
      - run: node --test .github/actions/target-cache/artifacts.test.mjs .github/actions/target-cache/artifacts.cargo.test.mjs
      - run: python3 -m py_compile scripts/fork/resolve-conflicts.py
        if: hashFiles('scripts/fork/resolve-conflicts.py') != ''

  clippy:
    name: Clippy (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Why no macOS: hosted macOS arm64 runners are scarce (a second job waited 15 min and was
        # never acquired), so macOS runs clippy inside its test job instead.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Why: NTFS plus Defender scanning is the slowest part of a Windows Rust build; a trusted
      # ReFS Dev Drive holding a copy of the workspace (and so target/) with real-time scanning
      # off builds much faster (test build, two runs each: 306/330 s → 192/297 s).
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Dev Drive (Windows)
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 40GB
          workspace-copy: true
          trusted-dev-drive: true
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true
      - name: Linux deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # tauri-build checks that frontendDist exists.
      - run: mkdir -p dist
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}

  test:
    name: Rust tests (${{ matrix.os }}${{ matrix.partition && format(' {0}', matrix.partition) || '' }})
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Why threads: macOS stays one job (scarce runners), and its tests are mostly waits on
          # git subprocesses and timeouts, so oversubscribing its 3 cores overlaps the waits.
          - { os: macos-latest, threads: "6" }
          - os: ubuntu-22.04
          # Three runners keep the projected Windows critical path below the single macOS job.
          # slice balances measured test time better than per-binary count (533 -> 497 test-seconds).
          # Why filter: ide-host's relay:: tests time out on these runners (#200); the relay only
          # runs inside Linux dev containers (ide-remote container_tunnel.rs), never on Windows.
          - { os: windows-latest, partition: "1/3", filter: "not (package(ide-host) & test(/^relay::/))" }
          - { os: windows-latest, partition: "2/3", filter: "not (package(ide-host) & test(/^relay::/))" }
          - { os: windows-latest, partition: "3/3", filter: "not (package(ide-host) & test(/^relay::/))" }
    runs-on: ${{ matrix.os }}
    # actions:write lets the develop run delete the target caches its save supersedes.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      # Why: NTFS plus Defender scanning is the slowest part of a Windows Rust build; a trusted
      # ReFS Dev Drive holding a copy of the workspace (and so target/) with real-time scanning
      # off builds much faster (test build, two runs each: 306/330 s → 192/297 s).
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Dev Drive (Windows)
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 40GB
          workspace-copy: true
          trusted-dev-drive: true
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      # Why no pnpm cache on Windows: pnpm installs on the Dev Drive, so the store setup-node
      # recorded on C: never exists and its post step fails the job.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ${{ runner.os != 'Windows' && 'pnpm' || '' }}
      # These Unix-only process tests returned immediately on macOS without Go on PATH.
      - uses: actions/setup-go@v6
        if: runner.os == 'macOS'
        with:
          go-version: stable
          cache: true
          cache-dependency-path: fixtures/go-app/go.mod
      - name: Verify Go toolchain (macOS)
        if: runner.os == 'macOS'
        run: go version
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      # The registry only: target/ is in the rolling target cache below.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: test
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true
      # Whole target/, workspace crates included, rolled forward by every develop run: a PR
      # rebuilds only the crates it changed (plus their dependents). The three Windows partitions
      # build the same thing, so only 1/3 saves.
      - uses: ./.github/actions/target-cache
        with:
          mode: restore
          name: test
          workdir: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - uses: taiki-e/install-action@nextest
      - name: Linux deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: pnpm install --frozen-lockfile && mkdir -p dist
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - name: Clippy (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cargo clippy --workspace --all-targets --message-format=json -- -D warnings | node .github/actions/target-cache/artifacts.mjs record "$RUNNER_TEMP/target-artifacts.jsonl"
      # Test fixtures write LF files; keep Git from converting them on checkout.
      - run: git config --global core.autocrlf false
      # --timings: per-crate build times in target/cargo-timings, uploaded below.
      - run: cargo nextest run --workspace --no-fail-fast --timings ${{ matrix.partition && format('--partition slice:{0}', matrix.partition) || '' }} ${{ matrix.threads && format('--test-threads {0}', matrix.threads) || '' }} ${{ matrix.filter && format('-E ''{0}''', matrix.filter) || '' }}
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-test-${{ runner.os }}-${{ strategy.job-index }}
          path: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/target/cargo-timings/cargo-timing.html
          retention-days: 14
          if-no-files-found: warn
      - name: Measure live target artifacts
        if: ${{ !cancelled() }}
        id: artifacts
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          cargo test --workspace --no-run --locked --offline --message-format=json | node .github/actions/target-cache/artifacts.mjs record "$RUNNER_TEMP/target-artifacts.jsonl"
          node .github/actions/target-cache/artifacts.mjs report target "$RUNNER_TEMP/target-artifacts.jsonl"
      - if: github.ref == 'refs/heads/develop' && steps.artifacts.outcome == 'success' && !cancelled() && (!matrix.partition || matrix.partition == '1/3')
        uses: ./.github/actions/target-cache
        with:
          mode: save
          name: test
          artifacts: ${{ runner.temp }}/target-artifacts.jsonl
          workdir: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
          token: ${{ github.token }}
      # nextest ran export_bindings, which rewrites src/bindings.ts.
      - name: Bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code src/bindings.ts

  server:
    name: Remote server (linux musl)
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-musl
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true
      - name: Linux deps
        uses: ./.github/actions/linux-deps
        with:
          packages: musl-tools
      - run: cargo build --locked -p ide-host --bin openidea-server --target x86_64-unknown-linux-musl
      - run: target/x86_64-unknown-linux-musl/debug/openidea-server --version

  # The plugin SDK, the official plugins and the test fixtures build in their own workspaces (the
  # root excludes them), so the jobs above don't see them. Ported from upstream's ci.yml `plugins`.
  plugins:
    name: Plugins (SDK, official, fixtures)
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-plugins
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip2, components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugins
          cache-directories: target-plugins
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          cache-on-failure: true
      - name: Format, lint (host and wasm) and test each crate
        shell: bash
        run: |
          set -euo pipefail
          for dir in sdk/rust/openidea-plugin plugins/official/*/ crates/ide-plugin/tests/fixtures/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            echo "::group::$dir"
            cargo fmt --check --manifest-path "$dir/Cargo.toml"
            cargo clippy --locked --all-targets --manifest-path "$dir/Cargo.toml" -- -D warnings
            cargo clippy --locked --target wasm32-wasip2 --manifest-path "$dir/Cargo.toml" -- -D warnings
            cargo test --locked --manifest-path "$dir/Cargo.toml"
            echo "::endgroup::"
          done
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # Plugin web pages (`web-src/`, their own pnpm projects): typecheck and test.
      - name: Web pages typecheck and test
        shell: bash
        run: |
          set -euo pipefail
          for dir in plugins/official/*/web-src/; do
            [ -f "$dir/package.json" ] || continue
            echo "::group::$dir"
            pnpm --dir "$dir" install --frozen-lockfile --ignore-workspace
            pnpm --dir "$dir" exec tsc --noEmit
            pnpm --dir "$dir" test
            echo "::endgroup::"
          done
      # The host's tests run the checked-in components: they must be built from these sources.
      # Web pages aren't checked in: this builds them and checks the result.
      - name: Checked-in components are up to date, web pages build
        run: plugins/build.sh --check

  deny:
    name: Cargo deny
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  frontend-static:
    name: Frontend static checks
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm build

  frontend-test:
    name: Frontend tests (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Why: vitest is 6 of the frontend's 7 minutes; Linux runners are plentiful.
        shard: [1, 2, 3]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/3

  e2e:
    name: E2E (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    # Keep the tag in step with @playwright/test (same as ci.yml).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e --shard=${{ matrix.shard }}/2
        env:
          HOME: /root
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  passed:
    name: Fork CI passed
    if: ${{ always() && !startsWith(github.event.head_commit.message, 'auto-rebase lock') }}
    needs: [scope, upstream-ci, precheck, clippy, test, server, plugins, deny, frontend-static, frontend-test, e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          # A job the scope skipped is fine; any failure or cancellation is not.
          echo "$RESULTS"
          echo "$RESULTS" | grep -Eq '"(failure|cancelled)"' && exit 1 || exit 0
