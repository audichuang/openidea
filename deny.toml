[advisories]
version = 2
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # SQLx MySQL uses RSA public-key encryption; russh/ssh-key use signatures.
    # No RSA private-key decryption is exposed to attacker-controlled ciphertext.
    { id = "RUSTSEC-2023-0071", reason = "RSA is used for MySQL password encryption and SSH signatures, not RSA decryption" },
    # russh < 0.65's agent server signs with confirm-constrained keys without asking; ide-ssh only
    # connects to an agent as a client (`keys::agent::client::AgentClient`) and serves none.
    { id = "RUSTSEC-2026-0495", reason = "only russh's agent client is used, never its agent server" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0", "Unlicense", "MIT-0",
    # File-level copyleft, used unmodified as dependencies.
    "MPL-2.0",
    "Unicode-3.0", "Unicode-DFS-2016", "CDLA-Permissive-2.0", "OpenSSL",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# SQLx's unreleased SQLite dependency ceiling fix, pinned in Cargo.toml.
allow-git = ["https://github.com/transact-rs/sqlx"]
required-git-spec = "rev"
